# Déploiement sur un VPS : Kooka + Caddy (HTTPS automatique avec Let's Encrypt).
# Voir docs/deploiement.md.
services:
  kooka:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - kooka-data:/data
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - kooka
    ports:
      - "80:80"
      - "443:443"
    # Caddy n'utilise que KOOKA_DOMAIN dans ce fichier.
    env_file: .env.production
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kooka-data:
  caddy-data:
  caddy-config:
